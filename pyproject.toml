[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "3gpp-spec-retriever"
version = "0.4.0"
description = "Version-pinned, traceable 3GPP clause retrieval for agents"
requires-python = ">=3.11"
dependencies = ["python-docx>=1.2,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
elastic = ["elasticsearch>=8.15,<9", "FlagEmbedding==1.4.2", "torch>=2.6,<3",
           "transformers>=4.44,<5", "peft>=0.13,<0.18"]

[project.scripts]
spec-retriever = "spec_retriever.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
